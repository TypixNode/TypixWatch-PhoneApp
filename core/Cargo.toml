[package]
name = "typix-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Protocol, pairing, OTA and transfer logic of the Typix Watch companion. No BLE and no UI."

[lib]
name = "typix_core"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2", features = ["zeroize"] }
getrandom = "0.2"
hkdf = "0.12"
sha2 = "0.10"
snow = "0.10"
subtle = "2"
thiserror = "2"
uniffi = "0.32"
x25519-dalek = "2"
zeroize = "1"

[build-dependencies]
cc = "1"

[dev-dependencies]
serde_json = "1"

# Line tables survive into the .a and .so, so a crash report can name Rust lines.
[profile.release]
debug = "line-tables-only"
